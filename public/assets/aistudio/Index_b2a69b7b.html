<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor, Procurement &amp; Payment Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"></noscript>
<style>
:root{
  --ink:#17223B;
  --ink-soft:#2B3A5A;
  --paper:#EFEEE8;
  --paper-raised:#F8F7F3;
  --line:#D8D5C9;
  --gold:#B8862B;
  --gold-soft:#E9D9B3;
  --seal-red:#8C2F2F;
  --green:#3B6E4A;
  --green-soft:#E1EBE3;
  --red:#9C3B3B;
  --red-soft:#F3E1E1;
  --muted:#6B7280;
  --radius:10px;
  --font-display:'Fraunces', serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:calc(14px * var(--fs,1));
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--gold-soft);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:calc(14px * var(--fs,1));}
a{color:inherit;}

/* Layout */
.app{display:flex;min-height:100vh;}
.sidebar{
  width:230px;flex-shrink:0;background:var(--ink);color:#EDEDE6;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{
  padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,0.1);
}
.brand-mark{
  display:flex;align-items:center;gap:10px;
}
.seal{
  width:34px;height:34px;border-radius:50%;border:2px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:calc(15px * var(--fs,1));color:var(--gold);
  flex-shrink:0;
}
.brand-logo{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:8px;padding:3px;flex-shrink:0;}
.sidebar.rail .brand-logo{width:34px;height:34px;}
.brand-title{font-family:var(--font-display);font-size:calc(16px * var(--fs,1));font-weight:600;line-height:1.2;}
.brand-sub{font-size:calc(10.5px * var(--fs,1));color:#9AA4BF;letter-spacing:.06em;text-transform:uppercase;margin-top:2px;}
.nav{flex:1;overflow-y:auto;padding:14px 10px;}
.nav-group-label{font-size:calc(10px * var(--fs,1));text-transform:uppercase;letter-spacing:.09em;color:#7C87A8;padding:14px 10px 6px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
  color:#C7CDE0;text-decoration:none;font-size:calc(13.5px * var(--fs,1));margin-bottom:2px;border:none;background:none;width:100%;text-align:left;
}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:rgba(184,134,43,0.18);color:#F3E0B0;}
.nav-item .num{
  font-family:var(--font-mono);font-size:calc(10.5px * var(--fs,1));color:#5F6A8C;width:16px;flex-shrink:0;
}
.nav-item.active .num{color:var(--gold);}
.sidebar-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,0.1);font-size:calc(11px * var(--fs,1));color:#7C87A8;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;gap:16px;padding:14px 26px;background:var(--paper-raised);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;
}
.search-wrap{flex:1;max-width:420px;position:relative;}
.search-wrap input{
  width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:8px;background:#fff;
}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45;}
.quick-actions{display:flex;gap:8px;margin-left:auto;}
.content{padding:24px 26px 60px;flex:1;}

h1.page-title{font-family:var(--font-display);font-weight:600;font-size:calc(26px * var(--fs,1));margin:0 0 4px;}
.page-sub{color:var(--muted);font-size:calc(13px * var(--fs,1));margin:0 0 22px;}

/* Buttons */
.btn{
  border:1px solid var(--ink);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;
  font-size:calc(13px * var(--fs,1));font-weight:500;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{background:var(--ink-soft);}
.btn.secondary{background:transparent;color:var(--ink);border-color:var(--line);}
.btn.secondary:hover{background:#fff;border-color:var(--ink);}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2A1E08;}
.btn.gold:hover{background:#a3781f;}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red-soft);}
.btn.danger:hover{background:var(--red-soft);}
.btn.sm{padding:6px 11px;font-size:calc(12px * var(--fs,1));}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* Cards / grid */
.grid{display:grid;gap:16px;}
.cards-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:1100px){.cards-4{grid-template-columns:repeat(2,1fr);}}
.cards-3{grid-template-columns:repeat(3,1fr);}
@media (max-width:1100px){.cards-3{grid-template-columns:repeat(2,1fr);}}
.cards-6{grid-template-columns:repeat(6,1fr);}
@media (max-width:1300px){.cards-6{grid-template-columns:repeat(3,1fr);}}
@media (max-width:700px){.cards-6{grid-template-columns:repeat(2,1fr);}}

/* Interactive report dashboard */
.view-toggle{display:inline-flex;background:var(--paper-raised);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;}
.view-toggle button{border:none;background:transparent;padding:7px 16px;border-radius:6px;font-size:calc(12.5px * var(--fs,1));font-weight:600;color:var(--muted);cursor:pointer;}
.view-toggle button.active{background:var(--ink);color:#EDEDE6;}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:1050px){.dash-grid{grid-template-columns:1fr;}}
.chart-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;padding:18px;}
.chart-card h4{margin:0 0 4px;font-size:calc(13.5px * var(--fs,1));font-weight:700;}
.chart-card .chart-sub{font-size:calc(11px * var(--fs,1));color:var(--muted);margin-bottom:10px;}
.chart-card .chart-wrap{position:relative;height:230px;}
.stat-card.clickable-stat{cursor:default;}
.mini-list{display:flex;flex-direction:column;}
.mini-list-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:calc(12.5px * var(--fs,1));}
.mini-list-row:last-child{border-bottom:none;}
.mini-list-row .mn{color:var(--muted);font-size:calc(11px * var(--fs,1));}
.insight-strip{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0 0;}
.insight-chip{flex:1;min-width:190px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:calc(12px * var(--fs,1));color:var(--ink-soft);}
.insight-chip b{display:block;font-family:var(--font-display);font-size:calc(15px * var(--fs,1));color:var(--ink);margin-top:2px;}
.stat-card{
  background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px;
  position:relative;overflow:hidden;
}
.stat-card .label{font-size:calc(11.5px * var(--fs,1));text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
.stat-card .value{font-family:var(--font-display);font-size:calc(32px * var(--fs,1));font-weight:600;margin-top:6px;}
.stat-card .num-tag{position:absolute;top:14px;right:16px;font-family:var(--font-mono);font-size:calc(11px * var(--fs,1));color:var(--line);}

.panel{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.panel-head h3{font-family:var(--font-display);font-size:calc(16px * var(--fs,1));font-weight:600;margin:0;}

table{width:100%;border-collapse:collapse;font-size:calc(13px * var(--fs,1));}
th{
  text-align:left;font-size:calc(11px * var(--fs,1));text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  border-bottom:1px solid var(--line);padding:8px 10px;font-weight:600;
}
td{padding:10px 10px;border-bottom:1px solid #E7E4D8;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.clickable:hover{background:rgba(184,134,43,0.06);cursor:pointer;}
.mono{font-family:var(--font-mono);}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;font-size:calc(11px * var(--fs,1));font-weight:600;
}
.badge.active{background:var(--green-soft);color:var(--green);}
.badge.inactive{background:var(--red-soft);color:var(--red);}
.badge.pending{background:var(--gold-soft);color:#8a611f;}
.badge.approved{background:var(--green-soft);color:var(--green);}
.badge.Pending{background:var(--gold-soft);color:#8a611f;}
.badge.Approved{background:#DCE7F5;color:#2B4C7A;}
.badge.Paid,.badge.Posted,.badge.Received{background:var(--green-soft);color:var(--green);}
.badge.Hold{background:var(--red-soft);color:var(--red);}
.badge.Cancelled{background:#E6E6E0;color:#6B7280;}
.badge.Initiated{background:#DCE7F5;color:#2B4C7A;}
.checkbox-cell{width:30px;}
.sel-row:hover{background:rgba(184,134,43,0.06);}
.totalLine{text-align:right;font-weight:700;margin-top:8px;}

/* Forms */
.form-section{margin-bottom:22px;}
.form-section-title{
  font-size:calc(11.5px * var(--fs,1));text-transform:uppercase;letter-spacing:.08em;color:var(--gold);font-weight:700;
  border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:14px;display:flex;align-items:center;gap:8px;
}
.form-section-title .dash{flex:1;height:1px;background:var(--line);}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media (max-width:900px){.form-grid{grid-template-columns:repeat(2,1fr);}}
.field label{display:block;font-size:calc(12px * var(--fs,1));font-weight:600;margin-bottom:5px;color:var(--ink-soft);}
.field .hint{font-size:calc(10.5px * var(--fs,1));color:var(--muted);font-weight:400;margin-left:5px;}
.field input,.field select,.field textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold-soft);border-color:var(--gold);}
.field textarea{resize:vertical;min-height:64px;}
.field.full{grid-column:1/-1;}

.empty-state{
  text-align:center;padding:50px 20px;color:var(--muted);
}
.empty-state h4{font-family:var(--font-display);font-size:calc(18px * var(--fs,1));color:var(--ink);margin-bottom:6px;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;}
.tab{padding:9px 4px;margin-right:18px;border:none;background:none;font-size:calc(13.5px * var(--fs,1));color:var(--muted);position:relative;font-weight:500;}
.tab.active{color:var(--ink);}
.tab.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--gold);}

.pill-toggle{display:flex;gap:6px;flex-wrap:wrap;}
.pill{padding:6px 12px;border-radius:100px;border:1px solid var(--line);background:#fff;font-size:calc(12.5px * var(--fs,1));}
.pill.selected{background:var(--ink);color:#fff;border-color:var(--ink);}

/* PO items table */
.items-table input{padding:6px 8px;font-size:calc(12.5px * var(--fs,1));}
.items-table td{padding:6px;}
.items-table th{padding:6px 8px;}
.totals-box{margin-left:auto;width:280px;}
.totals-row{display:flex;justify-content:space-between;padding:6px 0;font-size:calc(13px * var(--fs,1));border-bottom:1px dashed var(--line);}
.totals-row.grand{font-weight:700;font-size:calc(16px * var(--fs,1));border-bottom:none;border-top:2px solid var(--ink);padding-top:10px;margin-top:4px;}
.totals-row .mono{font-family:var(--font-mono);}

.modal-overlay{
  position:fixed;inset:0;background:rgba(23,34,59,0.55);display:flex;align-items:flex-start;justify-content:center;
  padding:40px 20px;overflow-y:auto;z-index:50;
}
.modal{background:var(--paper-raised);border-radius:12px;max-width:640px;width:100%;padding:26px 28px;}
.modal h3{font-family:var(--font-display);margin-top:0;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

.toast{
  position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:12px 20px;border-radius:8px;
  font-size:calc(13px * var(--fs,1));box-shadow:0 6px 20px rgba(0,0,0,0.2);z-index:100;display:flex;align-items:center;gap:8px;
}
.toast.error{background:var(--seal-red);}

.footer-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;padding-top:18px;border-top:1px solid var(--line);}

.doc-preview{
  background:#fff;border:1px solid var(--line);border-radius:8px;padding:26px 30px;font-size:calc(12.5px * var(--fs,1));
}
.doc-preview .po-head{display:flex;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:16px;}
.doc-preview h2{font-family:var(--font-display);margin:0 0 2px;font-size:calc(20px * var(--fs,1));}
.doc-preview table{margin-top:10px;}
.doc-preview th{background:var(--paper);}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chip{background:var(--paper);border:1px solid var(--line);padding:4px 10px;border-radius:6px;font-size:calc(11.5px * var(--fs,1));}

/* Advanced Payment Register report */
.filter-bar{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
.filter-bar .field-sm{display:flex;flex-direction:column;gap:5px;min-width:150px;flex:1;}
.filter-bar .field-sm label{font-size:calc(11px * var(--fs,1));font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
.filter-bar .field-sm input,.filter-bar .field-sm select{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);}
.filter-bar .field-sm input:focus,.filter-bar .field-sm select:focus{outline:2px solid var(--gold-soft);border-color:var(--gold);}
th.sortable:hover{color:var(--ink);}
/* ---- AI assistant ---- */
@media print{.ai-fab,.ai-panel{display:none !important;}}
.ai-fab{position:fixed;right:20px;bottom:20px;z-index:60;width:52px;height:52px;border-radius:50%;border:2px solid var(--gold);background:var(--ink);color:var(--gold-soft);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.28);}
.ai-fab:hover{background:var(--ink-soft);}
.ai-panel{position:fixed;right:20px;bottom:20px;z-index:60;width:min(400px,calc(100vw - 24px));height:min(580px,calc(100vh - 40px));background:var(--paper-raised);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.32);display:flex;flex-direction:column;overflow:hidden;}
.ai-head{background:var(--ink);color:#EDEDE6;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;}
.ai-hbtn{background:transparent;border:1px solid rgba(255,255,255,.25);color:#EDEDE6;border-radius:6px;padding:3px 9px;font-size:calc(12px * var(--fs,1));}
.ai-body{flex:1;overflow-y:auto;padding:12px;}
.ai-chip{display:block;width:100%;text-align:left;margin-bottom:6px;padding:8px 10px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:calc(12.5px * var(--fs,1));color:var(--ink);}
.ai-chip:hover{border-color:var(--gold);background:var(--gold-soft);}
.ai-msg{margin-bottom:10px;padding:9px 12px;border-radius:12px;font-size:calc(13px * var(--fs,1));line-height:1.5;max-width:94%;word-break:break-word;}
.ai-msg.user{background:var(--ink);color:#fff;margin-left:auto;white-space:pre-wrap;}
.ai-msg.bot{background:#fff;border:1px solid var(--line);}
.ai-msg.err{background:var(--red-soft);border-color:var(--red);color:var(--red);}
.ai-md p{margin:0 0 6px;}.ai-md ul{margin:0 0 6px;padding-left:18px;}
.ai-md table{font-size:calc(11.5px * var(--fs,1));margin:4px 0 8px;display:block;overflow-x:auto;}
.ai-md th,.ai-md td{padding:4px 7px;white-space:nowrap;}
.ai-md code{font-family:var(--font-mono);background:var(--paper);padding:0 3px;border-radius:3px;}
.ai-used{margin-top:6px;font-size:calc(10.5px * var(--fs,1));color:var(--muted);}
.ai-dots{color:var(--muted);font-style:italic;}
.ai-foot{display:flex;gap:8px;padding:10px 12px 6px;border-top:1px solid var(--line);align-items:flex-end;}
.ai-foot textarea{flex:1;resize:none;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:calc(13px * var(--fs,1));}
/* ---- popup calculator ---- */
.calc-wrap{display:inline-flex;align-items:center;gap:4px;width:100%;}
.calc-open{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:28px;height:30px;border:1px solid var(--line);background:#fff;border-radius:6px;color:var(--ink-soft);padding:0;}
.calc-open:hover{border-color:var(--gold);color:var(--gold);}
.calc-pop{background:var(--paper-raised);border-radius:12px;padding:14px;width:280px;box-shadow:0 12px 40px rgba(0,0,0,.3);outline:none;}
.calc-display{background:var(--ink);color:#EDEDE6;border-radius:8px;padding:10px 12px;margin-bottom:10px;text-align:right;min-height:64px;}
.calc-expr{font-family:var(--font-mono);font-size:calc(17px * var(--fs,1));word-break:break-all;}
.calc-result{font-family:var(--font-mono);font-size:calc(13px * var(--fs,1));color:var(--gold-soft);margin-top:4px;}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.calc-key{padding:10px 0;border:1px solid var(--line);background:#fff;border-radius:8px;font:600 14px Inter,sans-serif;color:var(--ink);}
.calc-key:hover{background:var(--gold-soft);}
.calc-key.op{background:#EEF1F8;}.calc-key.fn{background:var(--paper);}
.calc-key.eq{background:var(--ink);color:#fff;}
.calc-key.upd{grid-column:span 2;background:var(--gold);border-color:var(--gold);color:#2A1E08;}
.calc-key.cancel{grid-column:1 / -1;font-weight:500;font-size:calc(12px * var(--fs,1));padding:7px 0;}
.calc-key:disabled{opacity:.45;cursor:not-allowed;}
/* ---- Gmail tab ---- */
.mail-grid{display:grid;grid-template-columns:minmax(300px,1fr) 1.5fr;gap:16px;align-items:start;margin-top:16px;}
@media (max-width:1000px){.mail-grid{grid-template-columns:1fr;}}
.mail-row{padding:10px 14px;border-bottom:1px solid #E7E4D8;cursor:pointer;}
.mail-row:hover{background:rgba(184,134,43,0.06);}
.mail-row.open{background:var(--gold-soft);}
/* ---- access rights UI ---- */
.ro-banner{background:var(--gold-soft);border:1px solid var(--gold);color:#6b4e12;border-radius:8px;padding:8px 14px;font-size:calc(12.5px * var(--fs,1));margin-bottom:14px;}
.perm-table{width:100%;border-collapse:collapse;font-size:calc(13px * var(--fs,1));}
.perm-table th{font-size:calc(11px * var(--fs,1));text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center;padding:6px 8px;border-bottom:1px solid var(--line);}
.perm-table th:first-child{text-align:left;}
.perm-table td{padding:7px 8px;border-bottom:1px solid #EAE7DC;text-align:center;}
.perm-table td:first-child{text-align:left;}
.perm-table tr.grp td{background:var(--paper);font-size:calc(10.5px * var(--fs,1));text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:5px 8px;}
.perm-table input[type=radio]{width:16px;height:16px;accent-color:var(--ink);cursor:pointer;}
.perm-table input[disabled]{opacity:.25;cursor:not-allowed;}
.perm-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
.perm-bar .lbl{font-size:calc(12px * var(--fs,1));color:var(--muted);margin-right:2px;}

</style>
<style id="dwe-enhancer-css">
/* ===================================================================
   Dynamic Web Enhancer (ui-enhancer.css) — inlined & tuned for this app
   =================================================================== */
:root{
  --dwe-bg:var(--paper); --dwe-surface:var(--paper-raised); --dwe-text:var(--ink);
  --dwe-muted:var(--muted); --dwe-primary:var(--gold); --dwe-primary-2:#3B6E4A;
  --dwe-border:var(--line); --dwe-shadow:0 10px 30px rgba(23,34,59,.10); --dwe-radius:12px;
  --dwe-solid:#17223B;
}
html{scroll-behavior:smooth;}
body.dwe-enabled{color:var(--ink);background-color:var(--paper);text-rendering:optimizeLegibility;}
.dwe-enabled img,.dwe-enabled video,.dwe-enabled canvas,.dwe-enabled iframe{max-width:100%;}
.dwe-enabled :focus-visible{outline:3px solid color-mix(in srgb,var(--gold) 72%,white);outline-offset:2px;}
.dwe-enabled a{text-underline-offset:.2em;}

/* Polish only where it is safe: buttons, KPI cards, panels (nav, tabs, calculator keys untouched) */
.dwe-enabled .btn,.dwe-enabled .ai-fab{transition:transform .18s ease,box-shadow .18s ease,background .18s ease,filter .18s ease;}
.dwe-enabled .btn:not(:disabled):hover,.dwe-enabled .ai-fab:hover{transform:translateY(-2px);filter:brightness(1.04);box-shadow:0 6px 16px rgba(23,34,59,.16);}
.dwe-enabled .btn:not(:disabled):active{transform:translateY(0);}
.dwe-enabled .stat-card,.dwe-enabled .panel,.dwe-enabled .chart-card{
  border-radius:14px;box-shadow:var(--dwe-shadow);transition:transform .2s ease,box-shadow .2s ease;}
.dwe-enabled .stat-card:hover,.dwe-enabled .chart-card:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(23,34,59,.14);}
.dwe-enabled .dwe-gradient-text{background:linear-gradient(100deg,var(--dwe-primary),var(--dwe-primary-2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.dwe-enabled .dwe-card{border:1px solid var(--dwe-border);border-radius:var(--dwe-radius);background:var(--dwe-surface);box-shadow:var(--dwe-shadow);}

/* Toolbar: sits left of the AI assistant button, hides while the assistant is open */
.dwe-toolbar{position:fixed;z-index:55;right:84px;bottom:20px;display:flex;gap:8px;align-items:center;}
.dwe-tool-button{border:1px solid var(--dwe-border);border-radius:999px;background:#fff;color:#172033;
  box-shadow:0 8px 24px rgba(0,0,0,.14);min-width:44px;min-height:44px;padding:10px 14px;
  font:600 13px/1.2 Inter,system-ui,sans-serif;cursor:pointer;}
.dwe-tool-button:hover{border-color:var(--gold);}
body:has(.ai-panel) .dwe-toolbar{display:none;}
.dwe-toast{position:fixed;z-index:10000;left:50%;bottom:24px;transform:translate(-50%,18px);opacity:0;pointer-events:none;
  padding:12px 16px;border-radius:12px;background:#172033;color:#fff;box-shadow:var(--dwe-shadow);
  max-width:min(90vw,520px);font:500 14px/1.4 system-ui,sans-serif;transition:.25s ease;}
.dwe-toast.dwe-show{opacity:1;transform:translate(-50%,0);}
.dwe-progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:10001;
  background:linear-gradient(90deg,var(--dwe-primary),var(--dwe-primary-2));}
@media print{.dwe-toolbar,.dwe-progress,.dwe-toast{display:none !important;}}

/* ---------------- Colour themes (light). Dark mode below re-tints on top. ---------------- */
html[data-theme="ocean"]{--ink:#0F2E4A;--ink-soft:#24506F;--paper:#EAF1F6;--paper-raised:#F7FAFC;--line:#CBD9E4;--gold:#1F7FB8;--gold-soft:#CFE6F5;--muted:#5F7184;--on-accent:#fff;}
html[data-theme="forest"]{--ink:#17332A;--ink-soft:#2D5A49;--paper:#ECF1EA;--paper-raised:#F7FAF5;--line:#CFDACB;--gold:#3F8F5A;--gold-soft:#D5EAD9;--muted:#66756B;--on-accent:#fff;}
html[data-theme="royal"]{--ink:#2A1B4D;--ink-soft:#45307A;--paper:#F0EDF6;--paper-raised:#FAF8FD;--line:#D8D1E6;--gold:#7C4DDB;--gold-soft:#E3D9F7;--muted:#70688A;--on-accent:#fff;}
html[data-theme="rose"]{--ink:#4A1D2E;--ink-soft:#7A3350;--paper:#F8EEF0;--paper-raised:#FFF9FA;--line:#EAD3D8;--gold:#C2416A;--gold-soft:#F7D9E2;--muted:#8A6A73;--on-accent:#fff;}
html[data-theme="sunset"]{--ink:#3B2314;--ink-soft:#6B4128;--paper:#FBF1E6;--paper-raised:#FFF9F2;--line:#EBD6BF;--gold:#E07A1F;--gold-soft:#FBE0C2;--muted:#8A7058;--on-accent:#2A1405;}
html[data-theme="graphite"]{--ink:#1F2937;--ink-soft:#374151;--paper:#F1F2F4;--paper-raised:#FAFAFB;--line:#D5D8DD;--gold:#4B5563;--gold-soft:#E2E5EA;--muted:#6B7280;--on-accent:#fff;}

/* accent-aware overrides for rules that were hard-coded to the original gold */
.nav-item.active{background:color-mix(in srgb,var(--gold) 24%,transparent);color:#fff;}
tr.clickable:hover,.sel-row:hover,.mail-row:hover{background:color-mix(in srgb,var(--gold) 9%,transparent);}
.btn.gold,.calc-key.upd{color:var(--on-accent,#2A1E08);}
.btn.gold:hover{background:var(--gold);filter:brightness(.9);}
.dwe-enabled .btn.gold:not(:disabled):hover{filter:brightness(.92);}

/* ---------------- Dark mode mapped onto the app's own palette ---------------- */
html.dwe-dark{
  --ink:#E8EBF6; --ink-soft:#C3CAE0; --paper:#0E1325; --paper-raised:#161C33; --line:#2B3355;
  --muted:#9AA4BF; --gold:#D0A04A; --gold-soft:#3A3120; --green:#7CCB97; --green-soft:#1D3327;
  --red:#E58F8F; --red-soft:#3A2121; --seal-red:#B84545; --dwe-solid:#2A3560;
  --dwe-shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}
html.dwe-dark body{background-color:var(--paper);color:var(--ink);}
/* elements that use --ink as a SOLID background keep a dark fill */
html.dwe-dark .sidebar{background:#0A0E1C;border-right:1px solid var(--line);}
html.dwe-dark .btn,html.dwe-dark .view-toggle button.active,html.dwe-dark .pill.selected,
html.dwe-dark .ai-fab,html.dwe-dark .ai-head,html.dwe-dark .ai-msg.user,
html.dwe-dark .calc-display,html.dwe-dark .calc-key.eq,html.dwe-dark .toast{background:var(--dwe-solid);color:#EDEDE6;border-color:var(--dwe-solid);}
html.dwe-dark .btn:hover{background:#364478;}
html.dwe-dark .btn.secondary{background:transparent;color:var(--ink);border-color:var(--line);}
html.dwe-dark .btn.secondary:hover{background:var(--paper-raised);border-color:var(--gold);}
html.dwe-dark .btn.gold{background:var(--gold);border-color:var(--gold);color:#2A1E08;}
html.dwe-dark .btn.danger{background:transparent;color:var(--red);border-color:var(--red-soft);}
html.dwe-dark .btn.danger:hover{background:var(--red-soft);}
html.dwe-dark .toast.error{background:var(--seal-red);border-color:var(--seal-red);}
html.dwe-dark .ai-fab{border-color:var(--gold);color:var(--gold-soft);}
html.dwe-dark .calc-result{color:#E9D9B3;}
/* white surfaces become raised dark surfaces */
html.dwe-dark .search-wrap input,html.dwe-dark .field input,html.dwe-dark .field select,
html.dwe-dark .field textarea,html.dwe-dark .filter-bar .field-sm input,
html.dwe-dark .filter-bar .field-sm select,html.dwe-dark .pill,html.dwe-dark .ai-chip,
html.dwe-dark .ai-msg.bot,html.dwe-dark .ai-foot textarea,html.dwe-dark .calc-open,
html.dwe-dark .calc-key{background:#1C2442;color:var(--ink);border-color:var(--line);}
html.dwe-dark .calc-key.op{background:#232C4F;}
html.dwe-dark .calc-key.fn{background:var(--paper);}
html.dwe-dark .calc-key:hover,html.dwe-dark .ai-chip:hover{background:var(--gold-soft);}
html.dwe-dark .calc-key.upd{background:var(--gold);color:#2A1E08;}
html.dwe-dark .modal-overlay{background:rgba(3,6,16,.72);}
html.dwe-dark td,html.dwe-dark .mail-row,html.dwe-dark .perm-table td{border-bottom-color:var(--line);}
html.dwe-dark .badge.Approved,html.dwe-dark .badge.Initiated{background:#1E2C4A;color:#9DBCE8;}
html.dwe-dark .badge.Cancelled{background:#262B3E;color:#9AA4BF;}
html.dwe-dark .badge.pending,html.dwe-dark .badge.Pending{color:#E3BE74;}
html.dwe-dark .ro-banner{color:#E3BE74;}
html.dwe-dark .insight-chip{color:var(--ink-soft);}
html.dwe-dark .dwe-tool-button{background:#202742;color:#edf1ff;}
/* printed/previewed documents stay paper-white with dark ink */
html.dwe-dark .doc-preview{--ink:#17223B;--ink-soft:#2B3A5A;--paper:#EFEEE8;--line:#D8D5C9;--muted:#6B7280;
  --gold-soft:#E9D9B3;background:#fff;color:#17223B;}
html.dwe-dark .doc-preview td{border-bottom-color:#E7E4D8;}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}

html.dwe-dark[data-theme="ocean"]{--gold:#4DB0EA;--gold-soft:#17324A;--on-accent:#06202F;}
html.dwe-dark[data-theme="forest"]{--gold:#5CC083;--gold-soft:#17331F;--on-accent:#062012;}
html.dwe-dark[data-theme="royal"]{--gold:#A98BF0;--gold-soft:#2A2147;--on-accent:#1A0E3A;}
html.dwe-dark[data-theme="rose"]{--gold:#EE7CA0;--gold-soft:#3F1F2B;--on-accent:#3A0B1B;}
html.dwe-dark[data-theme="sunset"]{--gold:#F2A04F;--gold-soft:#3A2A16;--on-accent:#2A1405;}
html.dwe-dark[data-theme="graphite"]{--gold:#9AA6B8;--gold-soft:#2A303B;--on-accent:#111827;}
html.dwe-dark .btn.gold,html.dwe-dark .calc-key.upd{color:var(--on-accent,#2A1E08);}
html.dwe-dark .nav-item.active{background:color-mix(in srgb,var(--gold) 24%,transparent);color:#fff;}

/* ===================== Menu position (left / right / top / bottom) ===================== */
:root{--hz-h:54px;--fs:1;}
html[data-menu="right"] .app{flex-direction:row-reverse;}
html[data-menu="right"] .sidebar{border-left:1px solid rgba(255,255,255,.08);}
html[data-menu="top"] .app,html[data-menu="bottom"] .app{flex-direction:column;}
.sidebar.hz{width:100%;height:var(--hz-h);flex-direction:row;align-items:center;gap:6px;padding:0 14px;z-index:45;overflow:visible;}
.sidebar.hz-top{position:sticky;top:0;}
.sidebar.hz-bottom{position:sticky;top:auto;bottom:0;order:2;box-shadow:0 -6px 20px rgba(0,0,0,.18);}
.sidebar.hz .brand{border:none;padding:0 12px 0 0;flex-shrink:0;}
.sidebar.hz .brand-title{font-size:calc(15px * var(--fs,1));white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;}

.sidebar.hz .nav-item{width:auto;white-space:nowrap;margin:0;padding:8px 12px;flex-shrink:0;}
.sidebar.hz .nav-item .caret{font-size:9px;opacity:.7;margin-left:2px;}
.sidebar.hz .nav-item.open{background:rgba(255,255,255,.12);color:#fff;}

.sidebar.hz .hz-foot button{background:none;border:none;color:#9AA4BF;font-size:11px;cursor:pointer;padding:0;}
.nav-dd{position:fixed;z-index:80;min-width:220px;max-height:70vh;overflow-y:auto;background:var(--ink);color:#EDEDE6;

/* keep floating helpers clear of the menu */
html[data-menu="bottom"] .ai-fab,html[data-menu="bottom"] .ai-panel{bottom:calc(20px + var(--hz-h));}
html[data-menu="bottom"] .ai-panel{height:min(580px,calc(100vh - 40px - var(--hz-h)));}
html[data-menu="bottom"] .dwe-toolbar{bottom:calc(20px + var(--hz-h));}

html[data-menu="right"] .dwe-toolbar{right:calc(230px + 84px);}

/* ===================== Dynamic icon menu ===================== */
.nav-item svg{opacity:.92;}
.nav-ctl{background:none;border:none;color:#9AA4BF;padding:6px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
.nav-ctl:hover{background:rgba(255,255,255,.1);color:#fff;}
.sidebar.rail{width:68px;}
.sidebar.rail .brand{padding:16px 0 12px;}
.sidebar.rail .brand-mark{justify-content:center;}
.sidebar.rail .nav{padding:10px 8px;overflow-x:hidden;}

.nav-item.nav-ricon.open{background:rgba(255,255,255,.12);color:#fff;}

.nav-card{position:fixed;z-index:90;min-width:230px;overflow-y:auto;background:var(--ink);color:#EDEDE6;border-radius:12px;padding:8px;

.nav-card.mega{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 14px;width:min(560px,calc(100vw - 16px));}

.nav-toggle{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:7px 9px;flex-shrink:0;}
.nav-toggle:hover{background:var(--paper-raised);border-color:var(--ink);}

html[data-navmode="hidden"][data-menu="top"] .topbar{top:0;}

html[data-navmode="rail"][data-menu="right"] .dwe-toolbar{right:calc(68px + 84px);}

/* ===================== Dashboard charts ===================== */
